let grade=1, term=1;
const checked={};
function key(g,t,subj,wi){return `g${g}t${t}${subj}${wi}`}

function setGrade(g){
  grade=g;
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{b.classList.toggle('active',i+1===g)});
  render();
}
function setTerm(t){
  term=t;
  document.querySelectorAll('.term-btn').forEach((b,i)=>{b.classList.toggle('active',i+1===t)});
  render();
}

function render(){
  const area=document.getElementById('checklist-area');
  const gd=DATA[grade];
  const td=gd[term];
  const subjects=gd.subjects;
  let total=0,done=0;
  let html='';
  subjects.forEach(subj=>{
    const rows=td[subj]||[];
    html+=`<div class="subject-block"><div class="subject-label">${subj}</div><table>`;
    html+=`<tr><th style="width:70px">Week</th><th>Competency</th><th style="width:40px;text-align:center">Done</th></tr>`;
    rows.forEach((row,wi)=>{
      const k=key(grade,term,subj,wi);
      const chk=checked[k]?'checked':'';
      total++;
      if(checked[k])done++;
      html+=`<tr><td class="week-cell">${row.w}</td><td>${row.c}</td><td class="check-cell"><input type="checkbox" ${chk} onchange="toggle('${k}',this)"/></td></tr>`;
    });
    html+=`</table></div>`;
  });
  area.innerHTML=html;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('bar').style.width=pct+'%';
  document.getElementById('prog-pct').textContent=pct+'%';
  document.getElementById('prog-label').textContent=`Progress (${done}/${total}):`;
}

function toggle(k,el){
  checked[k]=el.checked;
  const allKeys=Object.keys(checked).filter(x=>x.startsWith(`g${grade}t${term}`));
  let done=0,total=0;
  const gd=DATA[grade];
  const td=gd[term];
  gd.subjects.forEach(subj=>{
    const rows=td[subj]||[];
    rows.forEach((_,wi)=>{const kk=key(grade,term,subj,wi);total++;if(checked[kk])done++;});
  });
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('bar').style.width=pct+'%';
  document.getElementById('prog-pct').textContent=pct+'%';
  document.getElementById('prog-label').textContent=`Progress (${done}/${total}):`;
}

render();
</script>
